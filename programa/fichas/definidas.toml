# Integrales definidas. La respuesta es un numero (vale 2 ln(3), π/4, 1/3...).
# `limites` admite oo (infinito). La clave se compara con sympy.
# Contexto: transformada de Laplace y trabajo W = ∫ p dV (termodinamica).

[[ficha]]
id = "DF-POLI"
tipo = "definida"
tecnica = "tabla"
enunciado = "(x^2 + ({c}))"
limites = ["0", "{b}"]
solucion = "({b})^3/3 + ({c})({b})"
params = { b = [1, 2, 3], c = [1, 2, 4] }
fuente = "Familia propia (areas)"
pistas = ["Primero la primitiva, despues Barrow.", "Primitiva: x^3/3 + ({c})x.", "Evalua en ({b}) y resta el valor en 0."]

[[ficha]]
id = "DF-ISOTERMO"
tipo = "definida"
tecnica = "tabla"
enunciado = "({k})/x"
limites = ["{v1}", "{v2}"]
solucion = "({k}) ln(({v2})/({v1}))"
params = { k = [1, 2, 3], v1 = [1, 2], v2 = [3, 4, 6] }
fuente = "Familia propia (trabajo isotermo W = ∫ nRT/V dV)"
pistas = ["Termodinamica: es el trabajo isotermo, presion = constante/volumen, con el volumen llamado x.", "Primitiva de 1/x: ln|x|.", "Evalua la primitiva en {v2} y resta su valor en {v1}; despues junta los logaritmos (resta de logaritmos = ln del cociente)."]

[[ficha]]
id = "DF-POLITROPICO"
tipo = "definida"
tecnica = "tabla"
enunciado = "x^(-{n})"
limites = ["1", "2"]
solucion = "(2^(1 - {n}) - 1)/(1 - {n})"
params = { n = ["13/10", "3/2", "6/5"] }
fuente = "Familia propia (proceso politropico p·V^n = cte)"
pistas = ["Potencia de x con exponente negativo no entero.", "Primitiva: x^(1 - {n})/(1 - {n}).", "Evalua entre 1 y 2; 1 elevado a cualquier cosa es 1."]

[[ficha]]
id = "DF-LAPLACE1"
tipo = "definida"
tecnica = "lineal"
enunciado = "e^(-({s})x)"
limites = ["0", "oo"]
solucion = "1/({s})"
params = { s = [1, 2, 3, 5] }
fuente = "Familia propia (Laplace: L{1} = 1/s, con s = numero)"
pistas = ["Integral impropia: primitiva y limite cuando x → ∞.", "Primitiva: -e^(-({s})x)/({s}).", "En ∞ la exponencial vale 0; en 0 vale 1."]

[[ficha]]
id = "DF-LAPLACE-T"
tipo = "definida"
tecnica = "partes"
enunciado = "x e^(-({s})x)"
limites = ["0", "oo"]
solucion = "1/({s})^2"
params = { s = [1, 2, 3, 4] }
fuente = "Familia propia (Laplace: L{t} = 1/s^2)"
pistas = ["Polinomio por exponencial, entre 0 e ∞.", "Partes con u = x, dv = e^(-({s})x) dx.", "Los terminos de borde dan 0; queda (1/({s}))∫ e^(-({s})x) dx."]

[[ficha]]
id = "DF-LAPLACE-SEN"
tipo = "definida"
tecnica = "partes"
enunciado = "e^(-({s})x) sen(x)"
limites = ["0", "oo"]
solucion = "1/(({s})^2 + 1)"
params = { s = [1, 2, 3] }
derivados = { s2 = "({s})^2" }
fuente = "Familia propia (Laplace: L{sen t} = 1/(s^2+1))"
pistas = ["Exponencial por seno: partes ciclica.", "Haz partes dos veces y vuelve a aparecer la integral I.", "Despeja I de I = (algo) - I/{s2}."]
larga = true

[[ficha]]
id = "DF-SUST"
tipo = "definida"
tecnica = "sustitucion"
enunciado = "x e^(x^2)"
limites = ["0", "1"]
solucion = "(e - 1)/2"
fuente = "Familia propia (cambio de limites en sustitucion)"
pistas = ["Sustitucion u = x^2.", "Cambia tambien los limites: x = 0 → u = 0, x = 1 → u = 1.", "Queda (1/2)∫ de 0 a 1 de e^u du."]
