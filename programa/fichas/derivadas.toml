# Fichas de derivadas. Si no hay "solucion", la clave es la derivada exacta
# calculada por sympy.

# ---------- Escalon 1: potencia, cadena, producto ----------

[[ficha]]
id = "D01"
tipo = "derivada"
tecnica = "potencia"
enunciado = "x^4"
solucion = "4x^3"
fuente = "Ejercicio tipo de calculo"
pistas = ["Potencia de x.", "Baja el exponente y resta 1.", "Ejemplo con otro numero: (x^7)' = 7x^6. Haz lo mismo con el 4."]

[[ficha]]
id = "D02"
tipo = "derivada"
tecnica = "potencia"
enunciado = "ln|x|"
solucion = "1/x"
fuente = "Ejercicio tipo de calculo"
pistas = ["Logaritmo de valor absoluto.", "Es de tabla, vale para x positivo y negativo.", "Misma derivada que ln x."]

[[ficha]]
id = "D03"
tipo = "derivada"
tecnica = "cadena"
enunciado = "e^(-x^2/2)"
solucion = "-x e^(-x^2/2)"
fuente = "Ejercicio tipo de calculo (solucion de una EDO separable)"
pistas = ["Exponencial de una funcion.", "Regla de la cadena: la misma exponencial por la derivada del exponente.", "La derivada de -x^2/2 es -x."]

[[ficha]]
id = "D04"
tipo = "derivada"
tecnica = "cadena"
enunciado = "arctan((x+2)/3)"
solucion = "3/((x+2)^2+9)"
fuente = "Ejercicio tipo de calculo (inversa de I04)"
pistas = ["arctan de una funcion.", "(arctan u)' = u'/(1+u^2).", "u = (x+2)/3, u' = 1/3; simplifica 1 + (x+2)^2/9."]

[[ficha]]
id = "D05"
tipo = "derivada"
tecnica = "cadena"
enunciado = "ln(x^2+4x+13)"
solucion = "(2x+4)/(x^2+4x+13)"
fuente = "Ejercicio tipo de calculo (inversa de I05)"
pistas = ["Logaritmo de una funcion.", "(ln u)' = u'/u.", "u' = 2x + 4."]

[[ficha]]
id = "DP-POLI"
tipo = "derivada"
tecnica = "potencia"
enunciado = "({a})x^{n} + ({b})x^{m} + ({c})"
params = { a = [2, 3, -4, 5], b = [-1, 6, 7], c = [3, -8], n = [3, 4, 5], m = [1, 2] }
fuente = "Familia propia"
pistas = ["Suma de potencias.", "Deriva termino a termino; la constante desaparece.", "({a})x^{n} → {a}·{n}·x^({n}-1)."]

[[ficha]]
id = "DC-EXP"
tipo = "derivada"
tecnica = "cadena"
enunciado = "e^(({a})x^2 + ({b})x)"
params = { a = [1, 2, -1, -3], b = [1, -2, 4] }
fuente = "Familia propia (soluciones de EDOs)"
pistas = ["Exponencial de un polinomio.", "La misma exponencial por la derivada del exponente.", "Deriva ({a})x^2 + ({b})x."]

[[ficha]]
id = "DC-LN"
tipo = "derivada"
tecnica = "cadena"
enunciado = "ln(({a})x^2 + ({c}))"
params = { a = [1, 2, 3], c = [1, 4, 5] }
fuente = "Familia propia (inversa de f'/f)"
pistas = ["Logaritmo de una funcion.", "(ln u)' = u'/u.", "u' = 2·{a}·x."]

[[ficha]]
id = "DC-POT"
tipo = "derivada"
tecnica = "cadena"
enunciado = "(({a})x^2 + ({b}))^{n}"
params = { a = [2, 3, -1], b = [1, -5, 7], n = [3, 4, 5] }
fuente = "Familia propia (inversa de S-XPOT)"
pistas = ["Potencia de una funcion.", "Baja el exponente, resta 1 y multiplica por la derivada de dentro.", "Derivada de dentro: 2·{a}·x."]

[[ficha]]
id = "DC-SEN"
tipo = "derivada"
tecnica = "cadena"
enunciado = "sen(({a})x^2)"
params = { a = [1, 2, 3] }
fuente = "Familia propia"
pistas = ["Seno de una funcion.", "Coseno de lo mismo por la derivada de dentro.", "Derivada de {a}x^2: 2·{a}·x."]

[[ficha]]
id = "DPR-XEXP"
tipo = "derivada"
tecnica = "producto"
enunciado = "x^{n} e^(({a})x)"
params = { n = [1, 2, 3], a = [1, 2, -1, -3] }
fuente = "Familia propia (comprobar primitivas por partes)"
pistas = ["Producto de dos funciones.", "(f·g)' = f'·g + f·g'.", "f = x^{n}, g = e^({a}x), g' = {a}·e^({a}x)."]

[[ficha]]
id = "DPR-XSEN"
tipo = "derivada"
tecnica = "producto"
enunciado = "x^{n} sen(({a})x)"
params = { n = [1, 2, 3], a = [1, 2, 3] }
fuente = "Familia propia"
pistas = ["Producto.", "f'·g + f·g'.", "La derivada de sen({a}x) es {a}·cos({a}x)."]

[[ficha]]
id = "DPR-XLN"
tipo = "derivada"
tecnica = "producto"
enunciado = "x^{n} ln(x)"
params = { n = [1, 2, 3, 4] }
fuente = "Familia propia (inversa de PA-XNLN)"
pistas = ["Producto de potencia y logaritmo.", "f'·g + f·g'.", "(ln x)' = 1/x: simplifica x^{n}/x."]

# ---------- Escalon 2: cociente ----------

[[ficha]]
id = "DCO-RAT"
tipo = "derivada"
tecnica = "cociente"
enunciado = "(({a})x + ({b}))/(x^2 + ({c}))"
params = { a = [1, 2, 3], b = [-1, 4], c = [1, 3, 5] }
solucion = "(({a})*({c}) - 2*({b})x - ({a})x^2)/(x^2 + ({c}))^2"
fuente = "Familia propia"
pistas = ["Cociente de polinomios.", "(f/g)' = (f'g - fg')/g^2.", "f' = {a}, g' = 2x."]

[[ficha]]
id = "DCO-EXP"
tipo = "derivada"
tecnica = "cociente"
enunciado = "e^x/(x + ({a}))"
params = { a = [1, 2, -3] }
solucion = "(x + ({a}) - 1) e^x/(x + ({a}))^2"
fuente = "Familia propia"
pistas = ["Cociente.", "(f'g - fg')/g^2.", "Saca e^x factor comun al final."]

[[ficha]]
id = "DCO-LN"
tipo = "derivada"
tecnica = "cociente"
enunciado = "ln(x)/x^{n}"
params = { n = [1, 2, 3] }
solucion = "(1 - ({n}) ln(x))/x^(({n}) + 1)"
fuente = "Familia propia"
pistas = ["Cociente con logaritmo.", "(f'g - fg')/g^2, o escribe ln(x)·x^(-{n}) y usa producto.", "(ln x)' = 1/x."]

# ---------- Escalon 3: inversas ----------

[[ficha]]
id = "DI-ATAN"
tipo = "derivada"
tecnica = "inversas"
enunciado = "arctan(({a})x)"
params = { a = [2, 3, 5] }
fuente = "Familia propia"
pistas = ["arctan de algo lineal.", "(arctan u)' = u'/(1+u^2).", "u = {a}x, u' = {a}."]

[[ficha]]
id = "DI-ASIN"
tipo = "derivada"
tecnica = "inversas"
enunciado = "arcsen(x/{a})"
params = { a = [2, 3, 4] }
fuente = "Familia propia"
pistas = ["arcsen de algo lineal.", "(arcsen u)' = u'/√(1-u^2).", "u = x/{a}, u' = 1/{a}; simplifica."]

# ---------- Escalon 4: logaritmica ----------

[[ficha]]
id = "DL-XSEN"
tipo = "derivada"
tecnica = "logaritmica"
enunciado = "x^(sen(x))"
solucion = "x^(sen(x)) (cos(x) ln(x) + sen(x)/x)"
fuente = "Ejercicio tipo de calculo (derivacion logaritmica)"
pistas = ["Base y exponente dependen de x: ninguna regla directa.", "Toma ln: ln y = sen(x) ln(x), y deriva los dos lados.", "A la izquierda sale y'/y; a la derecha, sen(x) ln(x) es un producto. Despues despeja y' y vuelve a poner y = x^(sen(x))."]
